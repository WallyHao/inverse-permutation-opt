[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tsp-perm-ea-bench"
version = "0.1.0"
description = "Auditable experiments for steady-state evolutionary algorithms on TSP"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tsp-perm-ea = "tsp_perm_ea_bench.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
